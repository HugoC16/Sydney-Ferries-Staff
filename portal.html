<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sydney Ferries Staff Portal</title>
  <style>

    body {
      background: #009E4D;
      margin: 0;
      height: 100vh;
      font-family: Arial;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    #welcome {
      font-size: 32px;
      font-weight: bold;
      color: black;
      transform-origin: center;
      opacity: 0;
      animation: emerge 0.5s ease-out forwards, hold 2s 0.5s forwards, squash 0.4s 2.5s ease-in forwards;
    }

    @keyframes emerge {
      0% { opacity: 0; transform: scale(0); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes hold {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes squash {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.1, 0.05); }
    }

    #content {
      opacity: 0;
      animation: fadeIn 0.8s ease-in forwards;
      animation-delay: 2.9s;
      width: 90%;
      max-width: 900px;
      margin-top: 20px;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .topTitle {
      font-size: 26px;
      font-weight: bold;
      color: black;
      margin: 0;
    }

    .serviceLabel {
      font-size: 18px;
      font-weight: bold;
      color: black;
      margin-top: 8px;
    }

    .activeStatus {
      color: red;
      font-weight: bold;
    }

    .routesGrid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .routeCard {
      background: rgba(255,255,255,0.9);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .routeBox {
      background: black;
      color: white;
      font-size: 20px;
      font-weight: bold;
      padding: 6px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .routeStatus {
      font-size: 16px;
      font-weight: bold;
      color: red;
      margin-bottom: 8px;
    }

    .splitRow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    .wharfStatus {
      color: #222;
    }

  </style>
</head>
<body>

  <div id="welcome">Successfully Logged Into Staff Portal</div>

  <div id="content">
    <h1 class="topTitle">Sydney Ferries | Staff Hub</h1>
    <div class="serviceLabel">Current Service - <span class="activeStatus">DISABLED</span></div>

    <div class="routesGrid">

      <script>
        const routes = [
          { id:"F2", status:"DISABLED", stops:["Circular Quay"," ","Taronga Zoo"], wharf:["OPEN"," "," ","OPEN"] },
          { id:"F4", status:"DISABLED", stops:["Circular Quay"," ","Milsons Point"," ","McMahons Point"], wharf:["OPEN"," "," ","OPEN"," "," ","OPEN"] },
          { id:"F5", status:"DISABLED", stops:["Circular Quay"," ","Kirribilli"," ","North Sydney"," ","Neutral Bay"," ","Kurraba Point"," ","Kirribilli"], wharf:["OPEN"," "," ","OPEN"," "," ", "OPEN"," "," ", "OPEN"," "," ","OPEN"," ","OPEN"] },
          { id:"F6", status:"DISABLED", stops:["Circular Quay"," ","Cremorne Point"," ","South Mosman"," ","Old Cremorne"," ","Mosman Bay"], wharf:["OPEN"," "," ","OPEN"," "," ","OPEN"," "," ","OPEN"," "," ","OPEN"] },
          { id:"SPECIAL", status:"DISABLED", stops:["Circular Quay"," ","Fort Denison"], wharf:["OPEN"," "," ","OPEN"] },
          { id:"SERVICE NOTES", status:"ALL WHARFS OPEN", stops:[""], wharf:[""] }
        ];

        document.write(routes.map(r => `
          <div class="routeCard">
            <div class="routeBox">${r.id}</div>
            <div class="routeStatus">${r.status}</div>
            <div class="splitRow">
              <div>${r.stops.join("<br>")}</div>
              <div class="wharfStatus">${r.wharf.join("<br>")}</div>
            </div>
          </div>
        `).join(""));
      </script>

    </div>
  </div>

</body>
</html>
